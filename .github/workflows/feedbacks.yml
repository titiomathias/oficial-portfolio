name: feedbacks

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    name: Coletar avaliações
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar avaliações
        env:
          URL: ${{ vars.URL }}
        run: python -m scripts.request_site

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- scripts/feedbacks.json; then
            echo "nenhuma avaliação nova"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/feedbacks.json
          git commit -m "chore: atualizar feedbacks"
          git push
