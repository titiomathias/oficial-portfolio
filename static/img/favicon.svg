<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="M de Matheus de Alencar">
    <title>Matheus de Alencar</title>

    <defs>
        <!-- Brilho neon do traço principal. -->
        <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Placa chanfrada: canto superior direito e inferior esquerdo cortados. -->
        <clipPath id="plate">
            <path d="M0 0 H48 L64 16 V64 H16 L0 48 Z"/>
        </clipPath>
    </defs>

    <g clip-path="url(#plate)">
        <path d="M0 0 H48 L64 16 V64 H16 L0 48 Z" fill="#0D0D0D"/>

        <!-- Scanlines: a textura CRT do resto do site, discreta o bastante para sumir a 16px. -->
        <g fill="#00F5FF" opacity="0.07">
            <rect x="0" y="6" width="64" height="1"/>
            <rect x="0" y="14" width="64" height="1"/>
            <rect x="0" y="22" width="64" height="1"/>
            <rect x="0" y="30" width="64" height="1"/>
            <rect x="0" y="38" width="64" height="1"/>
            <rect x="0" y="46" width="64" height="1"/>
            <rect x="0" y="54" width="64" height="1"/>
        </g>

        <!-- Aberração cromática: fantasma magenta deslocado atrás do traço cyan. -->
        <polyline points="12,47 12,17 32,35 52,17 52,47"
                  fill="none" stroke="#FF2E97" stroke-width="7"
                  stroke-linejoin="miter" stroke-linecap="square"
                  opacity="0.55" transform="translate(-2.2 1.4)"/>

        <polyline points="12,47 12,17 32,35 52,17 52,47"
                  fill="none" stroke="#00F5FF" stroke-width="7"
                  stroke-linejoin="miter" stroke-linecap="square"
                  filter="url(#neon)"/>
    </g>

    <!-- Moldura da placa, seguindo o chanfro. -->
    <path d="M0 0 H48 L64 16 V64 H16 L0 48 Z"
          fill="none" stroke="#00F5FF" stroke-width="2.5" opacity="0.45"/>
</svg>
